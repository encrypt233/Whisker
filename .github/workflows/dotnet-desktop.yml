name: Build Whisker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Whisker 通常兼容 .NET Framework，但 CI 用 .NET SDK 构建更顺畅；若报错可尝试 '6.0.x'

    - name: Restore dependencies
      run: dotnet restore Whisker.sln

    - name: Build
      run: dotnet build Whisker.sln --configuration Release --no-restore

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Whisker-Build
        path: |
          **/bin/Release/**/*.exe
          **/bin/Release/**/*.dll
